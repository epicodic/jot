[project]
name = "jot"
version = "0.1.0"
description = "Tiny inline editor for git commit messages and quick notes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.3",
    "textual-autocomplete>=4.0.0",
]

[dependency-groups]
dev = ["pytest>=8.4.2", "ruff>=0.13.0", "ty>=0.0.26"]

[project.scripts]
jot = "jot.main:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"
